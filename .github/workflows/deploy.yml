name: deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency: deploy
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy the Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
        run: |
          jq -n '{DASHSCOPE_API_KEY: env.DASHSCOPE_API_KEY}' > "$RUNNER_TEMP/secrets.json"
          npx --yes wrangler@4 deploy --secrets-file "$RUNNER_TEMP/secrets.json"
      - name: Smoke test (page, voices, speech from both providers)
        env:
          ACCESS_CLIENT_ID: ${{ secrets.ACCESS_CLIENT_ID }}
          ACCESS_CLIENT_SECRET: ${{ secrets.ACCESS_CLIENT_SECRET }}
        run: scripts/smoke-test.sh
