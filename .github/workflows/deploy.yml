name: deploy
on:
  push:  # every branch (the gate merges a branch when this is green); main alone deploys
  workflow_dispatch:
concurrency: "deploy-${{ github.ref }}"
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bundle check (on a branch nothing is deployed)
        if: github.ref != 'refs/heads/main'
        run: npx --yes wrangler@4 deploy --dry-run --outdir "$RUNNER_TEMP/dry"
      - name: Deploy the Worker
        if: github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
        run: |
          jq -n '{DASHSCOPE_API_KEY: env.DASHSCOPE_API_KEY}' > "$RUNNER_TEMP/secrets.json"
          npx --yes wrangler@4 deploy --secrets-file "$RUNNER_TEMP/secrets.json"
      - name: Smoke test (page, voices, speech from both providers)
        if: github.ref == 'refs/heads/main'
        env:
          ACCESS_CLIENT_ID: ${{ secrets.ACCESS_CLIENT_ID }}
          ACCESS_CLIENT_SECRET: ${{ secrets.ACCESS_CLIENT_SECRET }}
        run: scripts/smoke-test.sh
